[workspace]
resolver = "3"
members = ["livr-core", "livr-macros", "livr", "livr-typed-suite", "livr-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/koorchik/rust-livr"
homepage = "https://livr-spec.org"

[workspace.dependencies]
serde = "1"
# Map::retain
serde_json = "1.0.70"
# Few Unicode tables: `like` writes the classes and the case folding of
# JavaScript out as ranges, and JavaScript regular expressions (without the u
# flag) have no \\p{...} classes; `url` ignores case. 1.9: named groups as
# (?<name>...)
regex = { version = "1.9", default-features = false, features = ["std", "perf", "unicode-case"] }
ryu-js = "1"
# Exact versions: the code generated by schema! uses internals of livr-core,
# and the three crates are released together
livr-core = { path = "livr-core", version = "=0.1.0" }
livr-macros = { path = "livr-macros", version = "=0.1.0" }

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1

# The WebAssembly build: livr-wasm/build.sh
[profile.wasm]
inherits = "release"
panic = "abort"
strip = true
opt-level = "z"
